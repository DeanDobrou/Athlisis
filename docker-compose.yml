services:
  postgres:
    image: postgres:17
    container_name: crossfit-gym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymadmin
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: crossfit_gym
      TZ: Europe/Athens
      PGTZ: Europe/Athens
    ports:
      - "1013:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Catches every email sent in development. Read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    container_name: crossfit-gym-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata: